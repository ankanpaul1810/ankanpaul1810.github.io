<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Bloodline Plus...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
        }
    </style>
    <script>
        (function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // Detect iOS
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = 'https://apps.apple.com/in/app/bloodline-plus/id1623116020';
            }
            // Detect Android
            else if (/android/i.test(userAgent)) {
                window.location.href = 'https://play.google.com/store/apps/details?id=com.mindedge.bloodlinern';
            }
            // Fallback for desktop or unknown devices - redirect to Android store
            else {
                window.location.href = 'https://play.google.com/store/apps/details?id=com.mindedge.bloodlinern';
            }
        })();
    </script>
</head>
<body>
    <!-- Page intentionally blank - redirecting immediately -->
</body>
</html>
